name: verify README

# Re-checks every claim the README makes, regenerates the status strip from the
# real result, and commits it if it changed. Runs daily so a link that rots on a
# Tuesday shows up as red on Wednesday instead of sitting there for a year.

on:
  schedule:
    - cron: "17 6 * * *"      # 06:17 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-readme
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Deliberately no `pip install`: both scripts are stdlib-only, so this
      # workflow cannot break because of a dependency it doesn't have.

      - name: Verify claims
        id: verify
        continue-on-error: true       # record the failure, then still publish it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/verify.py

      - name: Render assets
        run: python scripts/render.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh verification status and assets [skip ci]"
            git push
          fi

      - name: Surface verification result
        run: |
          python - <<'PY'
          import json, sys, pathlib
          s = json.loads(pathlib.Path("data/status.json").read_text())
          c = s["checks"]
          print(f"## {c['passed']}/{c['total']} checks passing")
          for g in s["groups"]:
              print(f"- {g['name']}: {g['passed']}/{g['total']}")
          for f in s["failures"]:
              print(f"- FAILED: {f}")
          PY
          if [ "${{ steps.verify.outcome }}" != "success" ]; then
            echo "::error::README verification failed - see the log above"
            exit 1
          fi
